<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>구독 실패 | TrendScope</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(460px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        background: #fff;
        text-align: center;
      }

      a {
        color: #2563eb;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>구독 등록 실패</h1>
      <p id="message">카드 등록이 취소되었거나 실패했습니다.</p>
      <a href="./#subscribe">다시 시도하기</a>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const message = params.get("message");
      if (message) document.querySelector("#message").textContent = message;
    </script>
  </body>
</html>
