<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrendScope 결제 주문서</title><script src="https://js.tosspayments.com/v2/standard"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#111827;font-family:Arial,"Noto Sans KR",sans-serif}.wrap{width:min(760px,calc(100% - 32px));margin:0 auto;padding:34px 0 52px}.nav{border-bottom:1px solid #dbe3ef;background:#fff}.nav-inner{width:min(760px,calc(100% - 32px));min-height:62px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900}.badge{min-height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:999px;background:#eff6ff;color:#2563eb;font-size:12px;font-weight:900}h1{margin:0 0 8px;font-size:clamp(28px,5vw,42px);line-height:1.1}.lead{margin:0 0 18px;color:#667085;line-height:1.55}.card{overflow:hidden;border:1px solid #dbe3ef;border-radius:12px;background:#fff;box-shadow:0 20px 60px rgba(15,23,42,.08)}.price{padding:24px;border-bottom:1px solid #dbe3ef;background:linear-gradient(180deg,#f8fbff,#fff)}.price span{display:block;margin-bottom:8px;color:#2563eb;font-size:12px;font-weight:900;text-transform:uppercase}.price strong{display:block;font-size:38px;line-height:1}.price small{color:#667085;font-size:16px}.benefits{display:grid;gap:8px;margin:0;padding:20px 24px;list-style:none;color:#344054;font-size:14px;font-weight:700}.benefits li:before{content:"";width:10px;height:10px;display:inline-block;margin-right:8px;border-radius:50%;background:#16a34a}.widget{display:grid;gap:12px;padding:0 24px 20px}#payment-method,#agreement{overflow:hidden;border:1px solid #e6eaf2;border-radius:8px;background:#fff}.form{display:grid;gap:10px;padding:0 24px 24px}label{display:grid;gap:6px;color:#667085;font-size:12px;font-weight:900}input{width:100%;min-height:44px;padding:0 12px;border:1px solid #d7ddea;border-radius:8px;outline:0;font-size:15px}button{min-height:50px;border:1px solid #2563eb;border-radius:8px;background:#2563eb;color:#fff;font-size:16px;font-weight:900;cursor:pointer}button:disabled{border-color:#cbd5e1;background:#cbd5e1;cursor:wait}#status{margin:0;color:#667085;font-size:12px;line-height:1.5}</style></head><body><header class="nav"><div class="nav-inner"><div class="brand">TrendScope</div><span class="badge">Toss Payments Test</span></div></header><main class="wrap"><h1>TrendScope 월 멤버십 주문서</h1><p class="lead">토스페이먼츠 계약 심사용 테스트 결제 페이지입니다. 실제 결제 승인 처리는 아직 연결하지 않았습니다.</p><section class="card"><div class="price"><span>Monthly membership</span><strong>29,800원 <small>/ 월</small></strong></div><ul class="benefits"><li>트렌딩 제품 리스트 전체 열람</li><li>원본 소스 링크 및 커뮤니티 접근</li><li>월 단위 멤버십 이용</li></ul><div class="widget"><div id="payment-method"></div><div id="agreement"></div></div><form class="form" id="form"><label>이메일<input id="email" type="email" placeholder="reviewer@example.com" autocomplete="email"></label><label>이름<input id="name" type="text" maxlength="28" placeholder="심사위원" autocomplete="name"></label><button id="pay" type="submit" disabled>29,800원 결제하기</button><p id="status">토스 테스트 결제창을 준비하는 중입니다.</p></form></section></main><script>const clientKey="test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";const form=document.querySelector("#form"),pay=document.querySelector("#pay"),statusEl=document.querySelector("#status"),email=document.querySelector("#email"),nameEl=document.querySelector("#name");let widgets=null;const setStatus=(m)=>statusEl.textContent=m;const pageUrl=(p)=>new URL(p,location.href).href;const orderId=()=>`trendscope-${Date.now()}-${Math.random().toString(36).slice(2,10)}`;async function init(){try{if(!window.TossPayments)throw new Error("SDK unavailable");const toss=TossPayments(clientKey);widgets=toss.widgets({customerKey:TossPayments.ANONYMOUS});await widgets.setAmount({currency:"KRW",value:29800});await widgets.renderPaymentMethods({selector:"#payment-method",variantKey:"DEFAULT"});await widgets.renderAgreement({selector:"#agreement"});pay.disabled=false;setStatus("심사용 테스트 결제창입니다. 실제 승인 처리는 연결하지 않았습니다.")}catch(e){console.error(e);setStatus("토스 결제 위젯을 불러오지 못했습니다. 새로고침 후 다시 확인해주세요.")}}form.addEventListener("submit",async(e)=>{e.preventDefault();if(!widgets){setStatus("결제 위젯 준비 중입니다. 잠시 후 다시 눌러주세요.");return}try{setStatus("토스 결제창을 여는 중입니다.");await widgets.requestPayment({orderId:orderId(),orderName:"TrendScope 월 멤버십",successUrl:pageUrl("success.html"),failUrl:pageUrl("fail.html"),customerEmail:email.value.trim()||"reviewer@example.com",customerName:nameEl.value.trim()||"심사위원"})}catch(err){console.error(err);setStatus("결제창 호출이 취소되었거나 실패했습니다.")}});init();</script></body></html>
