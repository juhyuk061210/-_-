services:
  - type: web
    name: trendscope-community
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://trendscope-community.onrender.com
      - key: FRONTEND_URL
        value: https://juhyuk061210.github.io/-_-/
      - key: CORS_ORIGINS
        value: https://juhyuk061210.github.io
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: ADMIN_BYPASS
        value: "false"
      - key: MAX_CONNECTIONS
        value: "500"
      - key: MAX_STORED_POSTS
        value: "500"
      - key: COMMUNITY_FEED_LIMIT
        value: "80"
      - key: COMMUNITY_FEED_MAX_LIMIT
        value: "150"
