services:
  - type: web
    name: trendscope-community
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server-wrapper.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://trendscope-community.onrender.com
      - key: FRONTEND_URL
        value: https://juhyuk061210.github.io/-_-/
      - key: CORS_ORIGINS
        value: https://juhyuk061210.github.io
      - key: SESSION_COOKIE_SAMESITE
        value: None
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://trendscope-community.onrender.com/api/auth/google/callback
      - key: NAVER_CLIENT_ID
        sync: false
      - key: NAVER_CLIENT_SECRET
        sync: false
      - key: NAVER_REDIRECT_URI
        value: https://trendscope-community.onrender.com/api/auth/naver/callback
      - key: TOSS_BILLING_CLIENT_KEY
        sync: false
      - key: TOSS_BILLING_SECRET_KEY
        sync: false
      - key: TOSS_CLIENT_KEY
        sync: false
      - key: TOSS_SECRET_KEY
        sync: false
      - key: TOSS_WIDGET_VARIANT_KEY
        value: DEFAULT
      - key: TOSS_WIDGET_AGREEMENT_VARIANT_KEY
        value: AGREEMENT
      - key: BILLING_CRON_SECRET
        sync: false
      - key: MEMBERSHIP_AMOUNT
        value: "29800"
      - key: MEMBERSHIP_CURRENCY
        value: KRW
      - key: MEMBERSHIP_ORDER_NAME
        value: TrendScope Membership
      - key: ADMIN_BYPASS
        value: "false"
      - key: MAX_CONNECTIONS
        value: "500"
      - key: MAX_STORED_POSTS
        value: "500"
      - key: COMMUNITY_FEED_LIMIT
        value: "80"
      - key: COMMUNITY_FEED_MAX_LIMIT
        value: "150"
