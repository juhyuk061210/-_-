<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Processing | TrendScope</title>
    <meta name="trendscope-api-base" content="https://trendscope-community.onrender.com" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, "Noto Sans KR", sans-serif;
        background: #f8fafc;
        color: #111827;
      }

      main {
        width: min(460px, calc(100% - 32px));
        padding: 32px;
        border: 1px solid #dbe3ef;
        border-radius: 10px;
        background: #fff;
        text-align: center;
      }

      a {
        color: #2563eb;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Confirming payment</h1>
      <p id="message">Please wait while TrendScope confirms your payment.</p>
      <a href="./#subscribe">Back to TrendScope</a>
    </main>
    <script>
      const apiBase = document.querySelector('meta[name="trendscope-api-base"]').content.replace(/\/+$/, "");
      const params = new URLSearchParams(location.search);
      const title = document.querySelector("#title");
      const message = document.querySelector("#message");

      async function confirmPayment() {
        const paymentKey = params.get("paymentKey");
        const orderId = params.get("orderId");
        const amount = params.get("amount");

        if (!paymentKey || !orderId || !amount) {
          title.textContent = "Payment confirmation failed";
          message.textContent = "Missing Toss Payments confirmation data.";
          return;
        }

        try {
          const response = await fetch(`${apiBase}/api/payments/confirm`, {
            method: "POST",
            credentials: "include",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ paymentKey, orderId, amount: Number(amount) }),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "Payment confirmation failed.");

          title.textContent = "Payment complete";
          message.textContent = "Your TrendScope membership is now active.";
        } catch (error) {
          title.textContent = "Payment confirmation failed";
          message.textContent = error.message || "An error occurred while confirming payment.";
        }
      }

      confirmPayment();
    </script>
  </body>
</html>
