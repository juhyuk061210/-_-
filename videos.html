<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드랍쉬핑 영상 허브 — TikTok 큐레이션</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/videos.css">
</head>
<body class="videos-page">

  <!-- ===== HEADER ===== -->
  <header class="vid-header">
    <a class="vid-logo" href="videos.html">
      <div class="vid-logo-icon">D</div>
      <span class="vid-logo-text">Drop<span>Hub</span></span>
    </a>

    <div class="vid-search-wrap">
      <span class="vid-search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        class="vid-search"
        placeholder="영상 제목, 계정명, 태그 검색..."
      >
    </div>

    <div class="vid-header-actions">
      <button class="btn-add" id="btnAddVideo">+ 영상 추가</button>
    </div>
  </header>

  <!-- ===== HERO ===== -->
  <section class="vid-hero">
    <h1>드랍쉬핑 <span>TikTok</span> <em>영상 허브</em></h1>
    <p>국내외 드랍쉬핑 계정들의 유용한 영상을 한곳에서 — 링크로 연결된 공식 임베드</p>
  </section>

  <!-- ===== CATEGORY BAR ===== -->
  <nav class="category-bar" id="categoryBar"></nav>

  <!-- ===== MAIN ===== -->
  <main class="vid-main">
    <div class="vid-stats-bar">
      <p class="vid-count">영상 <strong id="vidCount">0</strong>개</p>
      <select class="sort-select" id="sortSelect">
        <option value="newest">최신순</option>
        <option value="oldest">오래된순</option>
      </select>
    </div>

    <div class="vid-grid" id="vidGrid">
      <!-- JS로 렌더링 -->
    </div>
  </main>

  <!-- ===== ADD VIDEO MODAL ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">TikTok 영상 추가</h2>
        <button class="modal-close" id="btnCancel">&times;</button>
      </div>

      <form id="addVideoForm">
        <div class="form-group">
          <label class="form-label" for="tiktokUrlInput">TikTok 영상 URL <span style="color:#fe2c55">*</span></label>
          <input
            type="url"
            id="tiktokUrlInput"
            class="form-input"
            placeholder="https://www.tiktok.com/@username/video/..."
            required
          >
          <p class="form-hint">
            TikTok 앱 또는 PC에서 공유 → <code>링크 복사</code> 후 붙여넣기
          </p>
        </div>

        <div class="form-group">
          <label class="form-label">미리보기</label>
          <div class="preview-box" id="previewBox">
            <p class="preview-placeholder">TikTok URL을 입력하면 미리보기가 표시됩니다</p>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="titleInput">영상 제목 <span style="color:#fe2c55">*</span></label>
          <input
            type="text"
            id="titleInput"
            class="form-input"
            placeholder="이 영상의 핵심 내용을 한 줄로 설명해 주세요"
            required
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="authorInput">계정명</label>
          <input
            type="text"
            id="authorInput"
            class="form-input"
            placeholder="@username (URL에서 자동 감지)"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="categorySelect">카테고리</label>
          <select id="categorySelect" class="form-select">
            <option value="product">제품 찾기</option>
            <option value="marketing">마케팅</option>
            <option value="profit">수익 인증</option>
            <option value="operation">운영 팁</option>
            <option value="beginner">초보자 가이드</option>
            <option value="supplier">공급업체</option>
            <option value="ads">광고 전략</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="tagsInput">태그 (쉼표로 구분)</label>
          <input
            type="text"
            id="tagsInput"
            class="form-input"
            placeholder="예: Shopify, 알리바바, 트렌드제품"
          >
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="btnCancelForm">취소</button>
          <button type="submit" class="btn-submit">영상 추가하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== TOAST ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="js/videos.js"></script>
</body>
</html>
